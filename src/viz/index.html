<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nous — {{PROJECT_NAME}}</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg0: #0b0d12;
    --bg1: #11131a;
    --bg2: #181b24;
    --bg3: #1f2330;
    --line: #2a2e3e;
    --text0: #e4e6ee;
    --text1: #969bb2;
    --text2: #555a72;
    --concept: #4d9de0;
    --decision: #f0a429;
    --pattern: #2dd4b0;
    --accent: #9b7fe8;
    --red: #e05c6a;
    --radius: 8px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }

  body {
    background: var(--bg0);
    color: var(--text0);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 56px 1fr;
  }

  /* ── Header ────────────────────────────── */
  header {
    grid-column: 1 / -1;
    background: var(--bg1);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header h1 span {
    color: var(--text2);
    font-weight: 400;
  }

  .stats-bar {
    display: flex;
    gap: 16px;
    margin-left: auto;
    font-size: 12px;
    color: var(--text2);
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stat .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .stat .count {
    color: var(--text0);
    font-family: var(--mono);
    font-weight: 600;
  }

  /* ── Search ────────────────────────────── */
  .search-box {
    position: relative;
    width: 280px;
  }

  .search-box input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text0);
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus {
    border-color: var(--accent);
  }

  .search-box input::placeholder { color: var(--text2); }

  .search-box svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text2);
  }

  /* ── Graph canvas ──────────────────────── */
  #graph-container {
    background: var(--bg0);
    position: relative;
    overflow: hidden;
  }

  #graph-container svg {
    width: 100%;
    height: 100%;
  }

  .node circle {
    cursor: pointer;
    stroke-width: 2;
    transition: r 0.15s;
  }

  .node circle:hover { filter: brightness(1.3); }

  .node.selected circle {
    stroke: #fff;
    stroke-width: 3;
  }

  .node text {
    font-size: 11px;
    fill: var(--text1);
    pointer-events: none;
    font-family: var(--font);
  }

  .link {
    stroke: var(--line);
    stroke-opacity: 0.5;
    stroke-width: 1.5;
  }

  .link-label {
    font-size: 9px;
    fill: var(--text2);
    font-family: var(--mono);
  }

  /* ── Sidebar ───────────────────────────── */
  #sidebar {
    background: var(--bg1);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  .sidebar-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text2);
    margin-bottom: 10px;
  }

  /* Filter pills */
  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-pill {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text1);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-pill:hover { border-color: var(--text1); }
  .filter-pill.active { border-color: transparent; color: #fff; }
  .filter-pill[data-type="concept"].active { background: var(--concept); }
  .filter-pill[data-type="decision"].active { background: var(--decision); }
  .filter-pill[data-type="pattern"].active { background: var(--pattern); }
  .filter-pill[data-type="all"].active { background: var(--accent); }

  /* Entry detail */
  #detail-panel {
    flex: 1;
    overflow-y: auto;
  }

  .detail-empty {
    padding: 40px 16px;
    text-align: center;
    color: var(--text2);
    font-size: 13px;
    line-height: 1.6;
  }

  .detail-content {
    padding: 16px;
  }

  .detail-type {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .detail-type.concept { background: rgba(77, 157, 224, 0.15); color: var(--concept); }
  .detail-type.decision { background: rgba(240, 164, 41, 0.15); color: var(--decision); }
  .detail-type.pattern { background: rgba(45, 212, 176, 0.15); color: var(--pattern); }

  .detail-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .detail-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text1);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .detail-meta {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .detail-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .tag {
    padding: 2px 6px;
    background: var(--bg3);
    border-radius: 4px;
    font-size: 10px;
    color: var(--text1);
    font-family: var(--mono);
  }

  .detail-relationships {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .detail-relationships h4 {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 6px;
  }

  .rel-item {
    font-size: 12px;
    padding: 4px 0;
    color: var(--text1);
    cursor: pointer;
  }

  .rel-item:hover { color: var(--text0); }

  .rel-type {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
  }

  /* Entry list */
  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .entry-item {
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .entry-item:hover { background: var(--bg3); }
  .entry-item.active { background: var(--bg3); }

  .entry-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .entry-item .title {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .entry-item .score {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text2);
  }

  /* ── Tooltip ───────────────────────────── */
  .tooltip {
    position: absolute;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 250px;
    z-index: 10;
  }

  .tooltip.visible { opacity: 1; }

  /* ── Legend ─────────────────────────────── */
  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--text2);
    background: rgba(11, 13, 18, 0.85);
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* ── Embedding banner ──────────────────── */
  .banner {
    padding: 10px 16px;
    font-size: 12px;
    line-height: 1.5;
    border-bottom: 1px solid var(--line);
  }

  .banner.warning {
    background: rgba(240, 164, 41, 0.08);
    border-bottom-color: rgba(240, 164, 41, 0.2);
    color: var(--text1);
  }

  .banner.ok {
    background: rgba(45, 212, 176, 0.06);
    border-bottom-color: rgba(45, 212, 176, 0.15);
    color: var(--text2);
  }

  .banner code {
    background: var(--bg3);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text0);
  }

  .banner a {
    color: var(--accent);
    text-decoration: none;
  }

  .banner a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>nous <span>/ {{PROJECT_NAME}}</span></h1>
  <div class="search-box">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search-input" placeholder="Search knowledge..." />
  </div>
  <div class="stats-bar" id="stats-bar"></div>
</header>

<div id="graph-container">
  <svg id="graph"></svg>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background: var(--concept)"></div> concept</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--decision)"></div> decision</div>
    <div class="legend-item"><div class="legend-dot" style="background: var(--pattern)"></div> pattern</div>
  </div>
  <div class="tooltip" id="tooltip"></div>
</div>

<div id="sidebar">
  <div id="embedding-banner"></div>
  <div class="sidebar-section">
    <h3>Filter</h3>
    <div class="filters">
      <button class="filter-pill active" data-type="all">All</button>
      <button class="filter-pill" data-type="concept">Concepts</button>
      <button class="filter-pill" data-type="decision">Decisions</button>
      <button class="filter-pill" data-type="pattern">Patterns</button>
    </div>
  </div>

  <div class="sidebar-section" id="entries-section">
    <h3>Entries</h3>
    <div class="entry-list" id="entry-list"></div>
  </div>

  <div id="detail-panel">
    <div class="detail-empty">
      Click a node or entry to see details
    </div>
  </div>
</div>

<script>
const TYPE_COLORS = { concept: '#4d9de0', decision: '#f0a429', pattern: '#2dd4b0' };
const HAS_EMBEDDINGS = {{HAS_EMBEDDINGS}};
const EMBEDDING_MODEL = '{{EMBEDDING_MODEL}}';

let allData = { nodes: [], edges: [] };
let simulation, svg, g, nodeElements, linkElements, labelElements;
let selectedId = null;
let activeFilter = 'all';

// ── Embedding banner ────────────────────────
function renderEmbeddingBanner(stats) {
  const banner = document.getElementById('embedding-banner');
  if (HAS_EMBEDDINGS) {
    const coverage = stats.total_entries > 0 ? Math.round(stats.embedding_coverage * 100) : 0;
    banner.innerHTML = `<div class="banner ok">Semantic search active — <code>${EMBEDDING_MODEL}</code> (${coverage}% coverage)</div>`;
  } else {
    banner.innerHTML = `
      <div class="banner warning">
        Semantic search disabled — keyword search only.<br>
        For full AI-powered search, set your API key:<br>
        <code>export OPENAI_API_KEY=sk-...</code><br>
        or add <code>"openai_api_key"</code> to <code>.nous/config.json</code>
      </div>`;
  }
}

// ── Fetch data ──────────────────────────────
async function fetchData() {
  const [graphRes, statsRes] = await Promise.all([
    fetch('/api/graph'),
    fetch('/api/stats'),
  ]);
  const graph = await graphRes.json();
  const stats = await statsRes.json();

  allData = graph;
  renderStats(stats);
  renderEmbeddingBanner(stats);
  renderEntryList(graph.nodes);
  renderGraph(graph);
}

function renderStats(stats) {
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat"><div class="dot" style="background: var(--concept)"></div><span class="count">${stats.by_type?.concept ?? 0}</span> concepts</div>
    <div class="stat"><div class="dot" style="background: var(--decision)"></div><span class="count">${stats.by_type?.decision ?? 0}</span> decisions</div>
    <div class="stat"><div class="dot" style="background: var(--pattern)"></div><span class="count">${stats.by_type?.pattern ?? 0}</span> patterns</div>
    <div class="stat"><span class="count">${stats.total_relationships ?? 0}</span> links</div>
  `;
}

// ── Entry list ──────────────────────────────
function renderEntryList(nodes) {
  const filtered = activeFilter === 'all' ? nodes : nodes.filter(n => n.type === activeFilter);
  const list = document.getElementById('entry-list');
  list.innerHTML = filtered.map(n => `
    <div class="entry-item ${n.id === selectedId ? 'active' : ''}" data-id="${n.id}" onclick="selectNode('${n.id}')">
      <div class="entry-dot" style="background: ${TYPE_COLORS[n.type]}"></div>
      <div class="title">${escHtml(n.title)}</div>
    </div>
  `).join('');
}

// ── Graph ────────────────────────────────────
function renderGraph(data) {
  const container = document.getElementById('graph-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  d3.select('#graph').selectAll('*').remove();

  svg = d3.select('#graph')
    .attr('viewBox', [0, 0, width, height]);

  g = svg.append('g');

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (e) => g.attr('transform', e.transform));
  svg.call(zoom);

  // Force simulation
  const nodes = data.nodes.map(d => ({ ...d }));
  const edges = data.edges.map(d => ({ ...d }));

  // Size nodes by content length
  nodes.forEach(n => {
    n.radius = Math.max(6, Math.min(20, 6 + (n.content?.length ?? 0) / 30));
  });

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(100).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.radius + 8))
    .force('x', d3.forceX(width / 2).strength(0.03))
    .force('y', d3.forceY(height / 2).strength(0.03));

  // Links
  linkElements = g.append('g')
    .selectAll('line')
    .data(edges)
    .join('line')
    .attr('class', 'link');

  // Link labels
  const linkLabels = g.append('g')
    .selectAll('text')
    .data(edges)
    .join('text')
    .attr('class', 'link-label')
    .text(d => d.type);

  // Nodes
  nodeElements = g.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragging)
      .on('end', dragEnd));

  nodeElements.append('circle')
    .attr('r', d => d.radius)
    .attr('fill', d => TYPE_COLORS[d.type] || '#666')
    .attr('stroke', d => d3.color(TYPE_COLORS[d.type] || '#666').darker(0.5));

  // Labels
  labelElements = nodeElements.append('text')
    .text(d => d.title.length > 25 ? d.title.slice(0, 23) + '...' : d.title)
    .attr('dx', d => d.radius + 5)
    .attr('dy', 4);

  // Interactions
  nodeElements
    .on('click', (e, d) => {
      e.stopPropagation();
      selectNode(d.id);
    })
    .on('mouseenter', (e, d) => showTooltip(e, d))
    .on('mouseleave', hideTooltip);

  svg.on('click', () => {
    selectedId = null;
    updateSelection();
    showEmptyDetail();
  });

  simulation.on('tick', () => {
    linkElements
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    linkLabels
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2);

    nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ── Drag ─────────────────────────────────────
function dragStart(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x;
  d.fy = d.y;
}

function dragging(e, d) {
  d.fx = e.x;
  d.fy = e.y;
}

function dragEnd(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}

// ── Selection ────────────────────────────────
async function selectNode(id) {
  selectedId = id;
  updateSelection();

  const res = await fetch(`/api/entry?id=${id}`);
  const entry = await res.json();
  showDetail(entry);
}

function updateSelection() {
  if (!nodeElements) return;
  nodeElements.classed('selected', d => d.id === selectedId);

  // Highlight connected links
  if (linkElements) {
    linkElements
      .attr('stroke-opacity', d =>
        selectedId ? (d.source.id === selectedId || d.target.id === selectedId ? 1 : 0.15) : 0.5
      )
      .attr('stroke-width', d =>
        selectedId && (d.source.id === selectedId || d.target.id === selectedId) ? 2.5 : 1.5
      );
  }

  // Update entry list selection
  document.querySelectorAll('.entry-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === selectedId);
  });
}

// ── Detail panel ─────────────────────────────
function showDetail(entry) {
  const panel = document.getElementById('detail-panel');

  const relHtml = (rels, direction) => {
    if (!rels || rels.length === 0) return '';
    return `
      <div class="detail-relationships">
        <h4>${direction}</h4>
        ${rels.map(r => `
          <div class="rel-item" onclick="selectNode('${direction === 'Outgoing' ? r.to_id : r.from_id}')">
            <span class="rel-type">${r.relation_type}</span>
            ${escHtml(direction === 'Outgoing' ? (r.to_title || r.to_id) : (r.from_title || r.from_id))}
          </div>
        `).join('')}
      </div>
    `;
  };

  panel.innerHTML = `
    <div class="detail-content">
      <div class="detail-type ${entry.type}">${entry.type}</div>
      <div class="detail-title">${escHtml(entry.title)}</div>
      <div class="detail-body">${escHtml(entry.content)}</div>
      ${entry.tags?.length ? `
        <div class="detail-tags">
          ${entry.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
        </div>
      ` : ''}
      <div class="detail-meta">
        <div>id: ${entry.id}</div>
        <div>scope: ${entry.scope || 'general'}</div>
        <div>confidence: ${entry.confidence}</div>
        <div>source: ${entry.source}</div>
        <div>created: ${entry.created_at}</div>
      </div>
      ${relHtml(entry.outgoing, 'Outgoing')}
      ${relHtml(entry.incoming, 'Incoming')}
    </div>
  `;
}

function showEmptyDetail() {
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-empty">Click a node or entry to see details</div>
  `;
}

// ── Tooltip ──────────────────────────────────
function showTooltip(event, d) {
  const tooltip = document.getElementById('tooltip');
  tooltip.innerHTML = `<strong>${escHtml(d.title)}</strong><br><span style="color:${TYPE_COLORS[d.type]}">${d.type}</span>`;
  tooltip.style.left = (event.offsetX + 15) + 'px';
  tooltip.style.top = (event.offsetY - 10) + 'px';
  tooltip.classList.add('visible');
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// ── Search ───────────────────────────────────
let searchTimeout;
document.getElementById('search-input').addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();

  if (!q) {
    renderEntryList(allData.nodes);
    return;
  }

  searchTimeout = setTimeout(async () => {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const results = await res.json();

    const list = document.getElementById('entry-list');
    list.innerHTML = results.map(r => `
      <div class="entry-item" data-id="${r.id}" onclick="selectNode('${r.id}')">
        <div class="entry-dot" style="background: ${TYPE_COLORS[r.type]}"></div>
        <div class="title">${escHtml(r.title)}</div>
        <div class="score">${r.score?.toFixed(3) || ''}</div>
      </div>
    `).join('');

    if (results.length === 0) {
      list.innerHTML = '<div style="padding:12px;color:var(--text2);font-size:12px">No results</div>';
    }
  }, 200);
});

// ── Filters ──────────────────────────────────
document.querySelectorAll('.filter-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeFilter = pill.dataset.type;
    renderEntryList(allData.nodes);
  });
});

// ── Utils ────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ─────────────────────────────────────
fetchData();
</script>
</body>
</html>
